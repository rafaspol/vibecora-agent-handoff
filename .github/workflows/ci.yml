name: CI
on:
  push:
    branches: ['main']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - name: Forbidden terms scan (soft when unconfigured)
        env:
          HANDOFF_FORBIDDEN_TERMS: ${{ secrets.HANDOFF_FORBIDDEN_TERMS }}
        run: node scripts/check-forbidden.mjs --soft
